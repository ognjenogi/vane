version: "3.8"
services:
  vane:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - vane-data:/home/vane/data
    environment:
      - NODE_ENV=production
      - SEARXNG_API_URL=http://searxng:8080
    depends_on:
      searxng:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '3'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vane-net

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng:/etc/searxng:rw
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - vane-net

volumes:
  vane-data:
    external: true

networks:
  vane-net:
    driver: bridge
