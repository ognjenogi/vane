# Production compose for Vane — matches the actual deployment topology on the VPS
# (verified against the live container, 2026-10-01).
#
# Notes:
# - The database, config.json and uploads live in the host directory /opt/Vane/data
#   (bind mount). There is deliberately NO named volume here: the old `vane-data`
#   volume is a stale Sep-15 copy and is intentionally NOT mounted anywhere.
# - SearXNG is started by the image's own entrypoint on localhost:8080 — it is not a
#   separate service.
# - The plain `Dockerfile` builds a broken image (its unpinned `yarn add playwright`
#   step upgrades Next past the tested version and every route 500s);
#   `Dockerfile.optimized` is the only supported build.
# - No memory/CPU limits: the live container runs unlimited, matching how production
#   has always run.
services:
  vane:
    build:
      context: .
      dockerfile: Dockerfile.optimized
    image: vane:main
    container_name: vane
    ports:
      - "3000:3000"
    volumes:
      - /opt/Vane/data:/home/vane/data
      - /opt/Vane/data:/home/perplexica/data
    environment:
      - NODE_ENV=production
      - SEARXNG_API_URL=http://localhost:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - default
      - shared-net

networks:
  shared-net:
    external: true
