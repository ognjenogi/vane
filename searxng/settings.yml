use_default_settings: true

general:
  instance_name: "vane-search"

search:
  autocomplete: "duckduckgo"
  default_lang: "en"
  formats:
    - html
    - json

server:
  secret_key: "6adaa05cb60fda826034b816a85e14ec3e1a00125091879ecd386b94d4e68911"
  limiter: false
  image_proxy: true

outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
  pool_connections: 100
  pool_maxsize: 20

engines:
