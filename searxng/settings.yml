    categories: [general, web]
    disabled: false
    weight: 1
  - name: google
    engine: google
    categories: [general, web]
    disabled: false
    weight: 1.5
  - name: qwant
    engine: qwant
    categories: [general, web]
    disabled: false
    weight: 1
  - name: yahoo
    engine: yahoo
    categories: [general, web]
    disabled: false
